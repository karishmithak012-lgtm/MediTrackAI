<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f8ff;
            color: #222;
        }

        header {
            background-color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2463d4;
        }

        .container {
            padding: 50px 8%;
            text-align: center;
        }

        h1 {
            color: #2463d4;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background-color: #2463d4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #174aab;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">💊 MediTrack AI</div>
    </header>

    <div class="container">
        <h1>Welcome to MediTrack AI 👋</h1>

        <p>
            Your smart medicine tracking assistant.
        </p>

        <a href="/login" class="btn">Get Started</a>
    </div>

</body>
</html>
