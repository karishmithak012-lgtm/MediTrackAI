<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack AI - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2463d4;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2463d4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #174ea6;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>💊 MediTrack AI</h1>

        <h2>Login</h2>

        <form action="/dashboard" method="GET">

    <input type="email" placeholder="Enter your email">

    <input type="password" placeholder="Enter your password">

    <button type="submit" class="btn">Login</button>

</form>

    </div>

</body>
</html>
